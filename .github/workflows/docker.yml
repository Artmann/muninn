name: Docker

# The image only needs rebuilding when something that affects it changes;
# a plain source change is already covered by CI. Run it by hand from the
# Actions tab to check the image on any branch.
on:
  pull_request:
    paths: &image-inputs
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths: *image-inputs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Only main writes the layer cache: exporting it takes minutes, and
      # PR-scoped caches can't be read by other PRs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
