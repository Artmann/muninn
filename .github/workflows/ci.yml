name: CI

on:
  pull_request:
  push:
    branches: [main]

# Superseded PR runs are cancelled, but runs on main always finish so they
# can save the caches that PR runs restore from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Debug info only slows linking and bloats the cache in CI.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # PR caches can't be read by other PRs and would only crowd main's
      # out of the 10 GB repository limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      # Matches docker-compose.yml; later releases need an auth token.
      localstack:
        image: localstack/localstack:4.14
        ports:
          - 4566:4566
        env:
          SERVICES: s3
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The embedding models are large and change rarely.
      - uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-${{ hashFiles('src/embed.rs') }}
          restore-keys: fastembed-
      - name: Unit tests
        run: cargo test --locked
      # s3vectors skips itself without TEST_VECTOR_BUCKET.
      - name: Integration and e2e tests
        run: cargo test --locked -- --ignored
      - name: Upload e2e server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: target/e2e-logs/
          if-no-files-found: ignore
