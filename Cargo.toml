[package]
name = "muninn"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-s3vectors = "1"
aws-smithy-runtime-api = "1"
aws-smithy-types = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
fastembed = "7"
futures = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "2"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tower = { version = "0.5", features = ["util"] }

# Debug info for dependencies is most of target/: every test binary gets
# its own copy (a ~450 MB .pdb each on Windows). Keep it for our own code.
[profile.dev.package."*"]
debug = false
